[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriproxkg"
version = "0.1.0"
description = "Taxonomic and chemical proximity for nutrition-aware food ingredient representation"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{name = "Naoki Yoshimaru"}, {name = "Kenji Hatano"}]
dependencies = ["numpy==2.2.6", "pandas==2.3.3", "scipy==1.15.3", "scikit-learn==1.7.2", "rdflib==7.5.0", "PyYAML==6.0.3", "tqdm==4.67.1", "torch==2.9.1", "torch-geometric==2.7.0"]

[project.scripts]
nutriproxkg = "nutriproxkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
